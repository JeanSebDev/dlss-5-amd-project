name: Build OptiScaler AMD v2.25

on:
  push:
    branches:
      - codex/async-presr-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore published OptiScaler link libraries
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass.git upstream-deps
          git -C upstream-deps sparse-checkout init --cone
          git -C upstream-deps sparse-checkout set OptiScaler/library external/freetype
          git -C upstream-deps checkout e237f895623742b761f9e5f00067cb3dc62619f4
          Copy-Item -LiteralPath 'upstream-deps\OptiScaler\library' -Destination 'OptiScaler-DLSSNR-PreSR-Multipass-main\OptiScaler' -Recurse -Force
          Copy-Item -LiteralPath 'upstream-deps\external\freetype\freetype.lib' -Destination 'OptiScaler-DLSSNR-PreSR-Multipass-main\external\freetype\freetype.lib' -Force

      - name: Build corrected OptiScaler
        working-directory: OptiScaler-DLSSNR-PreSR-Multipass-main
        run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload corrected DLL
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-AMD-v225-async
          path: OptiScaler-DLSSNR-PreSR-Multipass-main/x64/Release/OptiScaler.dll
          if-no-files-found: error
          retention-days: 7
