name: Build OptiScaler AMD v2.25

on:
  push:
    branches:
      - codex/async-presr-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK import library
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK installation was not found' }
          $target = 'OptiScaler-DLSSNR-PreSR-Multipass-main\OptiScaler\library\vulkan'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -LiteralPath (Join-Path $sdk.FullName 'Lib\vulkan-1.lib') -Destination $target -Force

      - name: Build static FreeType dependency
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install 'freetype[core]:x64-windows-static' --clean-after-build
          $library = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static\lib\freetype.lib'
          if (-not (Test-Path -LiteralPath $library)) { throw 'Static FreeType library was not built' }
          Copy-Item -LiteralPath $library -Destination 'OptiScaler-DLSSNR-PreSR-Multipass-main\external\freetype\freetype.lib' -Force

      - name: Build corrected OptiScaler
        working-directory: OptiScaler-DLSSNR-PreSR-Multipass-main
        run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload corrected DLL
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-AMD-v225-async
          path: OptiScaler-DLSSNR-PreSR-Multipass-main/x64/Release/OptiScaler.dll
          if-no-files-found: error
          retention-days: 7
